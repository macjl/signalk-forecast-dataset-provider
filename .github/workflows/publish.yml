name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify, build and test
        run: npm run check

      - name: Check package contents
        run: npm pack --dry-run

      - name: Read package metadata
        id: package
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ "${RELEASE_TAG#v}" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release tag does not match package.json version."
            exit 1
          fi

      - name: Verify npm package exists
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: |
          if ! npm view "$PACKAGE_NAME" name --registry=https://registry.npmjs.org >/dev/null; then
            echo "::error::Bootstrap the npm package and configure trusted publishing before releasing. See RELEASING.md."
            exit 1
          fi

      - name: Check npm version
        id: npm
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          GITHUB_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tag=latest
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            channel="${PACKAGE_VERSION#*-}"
            case "$channel" in
              alpha|alpha.*) tag=alpha ;;
              beta|beta.*) tag=beta ;;
              rc|rc.*) tag=rc ;;
              *) tag=next ;;
            esac
          elif [[ "$GITHUB_PRERELEASE" == "true" ]]; then
            echo "::error::A GitHub prerelease must use a prerelease version in package.json, not a stable version."
            exit 1
          fi
          npm publish --provenance --access public --tag "$tag"
